{{define "content"}}
<section class="panel">
  <h2>Password reset for {{.Username}}</h2>
  <p class="muted" style="font-size:13px;">Shown once — Wharf doesn't send this anywhere, so copy it to {{.Username}} yourself. They'll be forced to set their own password on their next login.</p>
  <div class="code-box">
    <pre id="newpassword">{{.NewPassword}}</pre>
    <button class="btn btn-ghost copy-btn" data-copy-target="newpassword">Copy</button>
  </div>
  <p style="margin-top:16px;"><a href="/users" class="btn btn-ghost">Back to Users</a></p>
</section>
{{end}}
