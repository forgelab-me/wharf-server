{{define "content"}}
<div class="login-shell">
  <div class="login-card">
    <div class="brand">⚓ Wharf</div>
    <p class="muted" style="margin:0 0 16px; font-size:13px;">Set a new password before continuing.</p>
    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
    <form method="post" action="/change-password">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="form-row">
        <label>Current password</label>
        <input type="password" name="current_password" autofocus required>
      </div>
      <div class="form-row">
        <label>New password</label>
        <input type="password" name="new_password" required minlength="8">
      </div>
      <div class="form-row">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Change password</button>
    </form>
    <form method="post" action="/logout" style="margin-top:12px;">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="link-btn">Sign out instead</button>
    </form>
  </div>
</div>
{{end}}
